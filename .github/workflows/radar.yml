name: Radar ofert logistyki

on:
  schedule:
    # 05:07 UTC = 07:07 czasu letniego / 06:07 zimowego (przed przebiegiem Claude o 8:00)
    - cron: "7 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  zbierz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zależności
        run: pip install -r requirements.txt

      - name: Zbierz kandydatów (LinkedIn + SerpAPI)
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scraper/radar.py

      - name: Zapisz wyniki w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Wyniki radaru $(date -u +%Y-%m-%dT%H:%MZ)" || echo "Brak zmian"
          git push
