name: Radar ofert logistyki

on:
  schedule:
    # Godziny w UTC (w Polsce latem +2 h, zimą +1 h). GitHub potrafi opóźnić start o kilkanaście minut.
    - cron: "20 5 * * *"    # raz dziennie przed 8:00 w Polsce: LinkedIn + Google (SerpAPI)
  workflow_dispatch:
    inputs:
      serp:
        description: "Uruchomić też SerpAPI (zużywa limit wyszukiwań)?"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zbierz oferty
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          RUN_SERP: ${{ github.event_name == 'schedule' || inputs.serp }}
        run: python radar.py

      - name: Zapisz wyniki w repozytorium
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Brak zmian."
          else
            git commit -m "Radar: wyniki $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
