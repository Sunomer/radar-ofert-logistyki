name: Radar ofert

on:
  schedule:
    # 05:05 UTC = 7:05 czasu letniego / 6:05 zimowego w Warszawie (GitHub bywa spóźniony do ~30 min)
    - cron: "5 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  zbierz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instaluj biblioteki
        run: pip install requests beautifulsoup4

      - name: Zbierz oferty (LinkedIn + SerpAPI)
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/radar.py

      - name: Zapisz wyniki w repozytorium
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data
          git commit -m "Wyniki radaru $(date -u +%F)" || echo "Brak zmian"
          git push
